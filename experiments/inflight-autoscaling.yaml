# =====================================================================
# Experiment: Inflight-Requests Autoscaling Token Shapes (inference-perf)
# =====================================================================
#
# Three workloads with very different token shapes against one inflight-requests
# autoscaled stack. The shape is the independent variable; whether a request-count
# signal crosses its threshold on each shape is the result.
#
#   random_prefill_heavy  ISL/OSL 8192/256   32:1  -> short service time, low concurrency
#   random_symmetrical    ISL/OSL 2048/2048   1:1  -> middle of the range
#   random_decode_heavy   ISL/OSL 256/4096   1:16  -> long service time (4096 decode steps), high concurrency
#
# The profiles themselves are general-purpose token-shape workloads, not specific
# to autoscaling -- this experiment is one consumer of them.
#
# llm_d_epp_inflight_requests ~= in-flight request concurrency (Little's Law:
# L = lambda x W). A request-count signal is blind to per-request size, so the
# three shapes can drive very different in-flight counts at the same offered rate.
# That cross-shape behavior is exactly what this DoE measures. See
# docs/inflight-autoscaling.md.
#
#
# Usage (against a stood-up stack -- see docs/inflight-autoscaling.md):
#   llmdbenchmark --spec guides/keda-epp-inflight run \
#     --harness inference-perf \
#     --experiments experiments/inflight-autoscaling.yaml \
#     --monitoring
#
# Usage (run-only -- against an already-standing endpoint):
#   llmdbenchmark --spec guides/keda-epp-inflight run \
#     --endpoint-url http://<HOST>:<PORT> \
#     --model <MODEL_NAME> --namespace <NAMESPACE> \
#     --harness inference-perf --workload random_symmetrical.yaml \
#     --experiments experiments/inflight-autoscaling.yaml
#
# =====================================================================

# --- DoE Metadata (informational -- not consumed by the runtime) ------

experiment:
  name: inflight-autoscaling
  description: >
    Three token-shape workloads (prefill-heavy, symmetrical, decode-heavy)
    against inflight-requests KEDA autoscaling, to ground the guide's default
    request-count signal across workload shapes -- whether a per-replica
    concurrency target of 16 is crossed, and how max/avg GPUs, TTFT and ITL
    respond, when the same autoscaled pool meets each shape.
  harness: inference-perf
  profile: random_symmetrical.yaml

# Cleared once per group. The profiles use random token IDs so cross-run prefix
# reuse is already nil, but a reset keeps the groups independent.
reset_caches: true

# A treatment that degrades under its own load is the result, not a defect.
treatment_max_attempts: 1
treatment_stop_on_error: false

# SEQUENTIAL, deliberately. Concurrent members would share one autoscaled pool,
# making the replica count attributable to neither shape. This is the opposite of
# mixed-workload-contention.yaml, where interference IS the result being sought.
max_parallel_treatments: 1

groups:
  - name: prefill_heavy
    treatments:
      - name: prefill_heavy
        profile: random_prefill_heavy.yaml

  - name: symmetrical
    treatments:
      - name: symmetrical
        profile: random_symmetrical.yaml

  - name: decode_heavy
    treatments:
      - name: decode_heavy
        profile: random_decode_heavy.yaml
