# =====================================================================
# Experiment: Turn-Priority Fairness Concurrency Ladder (inference-perf)
# =====================================================================
#
# Sweeps concurrent replay sessions against the two-band turn-priority
# configuration. Turn-priority and the round-robin baseline behave alike
# until the pool is contended, so the separation only shows at the top of
# the ladder.
#
# Drives the shipped weka_traces.yaml profile; every difference the band
# layout needs is a constant below, so no separate profile is needed.
#
# Compatible harness: inference-perf
# Compatible workload: weka_traces.yaml
#
# Usage:
#   llmdbenchmark --spec guides/turn-priority-fairness experiment \
#     --namespace <NAMESPACE> \
#     --experiments experiments/turn-priority-fairness.yaml \
#     --wait-timeout 9300

# Clear vLLM prefix/mm/encoder caches on every serving pod before each
# treatment so every value starts cold. Requires VLLM_SERVER_DEV_MODE=1
# (the repo default). Non-fatal if dev mode is off. Default false.
reset_caches: true

treatment_max_attempts: 5

# The top of the ladder is expected to shed requests.
treatment_stop_on_error: false
validate_failures: false

constants:
  load.stages.0.num_sessions: 200
  load.stages.0.timeout: 9000
  load.request_timeout: 9000
  api.headers:
    x-llm-d-inference-objective: agentic-sessions
  data.weka_trace_replay.num_dataset_entries: 200

treatments:
  - name: conc16
    load.stages.0.concurrent_sessions: 16
  - name: conc32
    load.stages.0.concurrent_sessions: 32
  - name: conc64
    load.stages.0.concurrent_sessions: 64
  - name: conc128
    load.stages.0.concurrent_sessions: 128
