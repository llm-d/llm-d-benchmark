# eval-containers / gaia example scenario.
#
# Deploys a model on llm-d (the CPU inference-sim base below -- swap for a real
# GPU-served model for meaningful scores) and runs the eval-containers harness:
# the GAIA general-AI-assistant benchmark, one task per parallel pod.
#
#   llmdbenchmark --spec examples/eval-containers-gaia run -p "$NS" -j <#tasks>
#
# The model deployment below mirrors sim.yaml (CPU, no GPU); only the
# images.benchmark and harness blocks differ. GAIA is a web/tool agentic task,
# so the harness pod needs internet egress (and an HF token if the deployment
# gates the dataset -- enable huggingface.* to inject HF_TOKEN).
#
# IMPORTANT NOTE:
# All parameters not defined here use the default values from defaults.yaml.

scenario:
  # ============================================================================
  # Sim - Resource-limited simulated inference (no GPUs)
  # ============================================================================
  - name: "eval-gaia"

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================
    common:
      affinity:
        enabled: true
        nodeSelector:
          kubernetes.io/os: linux

      accelerator:
        count: 0
        # Corresponds to: LLMDBENCH_VLLM_COMMON_ACCELERATOR_MEMORY=24
        # To pass capacity planner sanity checking
        memory: 24

      model:
        name: facebook/opt-125m
        shortName: facebook-opt-125m
        path: models/facebook/opt-125m
        huggingfaceId: facebook/opt-125m
        gpuMemoryUtilization: 0
        # Corresponds to: LLMDBENCH_VLLM_COMMON_MAX_MODEL_LEN=1024
        maxModelLen: 1024
        size: 2Gi

      storage:
        # Harness results PVC.
        # accessModes and storageClassName are cluster-specific.
        # Set them in your --cluster-config file (see docs/openshift-setup.md).
        # Defaults: RWO + cluster-default storage class (works on kind/vanilla K8s).
        # Multi-node clusters typically need ReadWriteMany and a shared storage class.
        workloadPvc:
          accessModes:
            - ReadWriteOnce
          # storageClassName: ""   # leave empty to use the cluster default
        modelPvc:
          size: 2Gi
          accessMode:
            - ReadWriteOnce
        uriProtocol: hf

      # NOTE: `images` and `vllmCommon` belong at `common.<key>`, NOT nested
      # inside `common.storage`. One level deeper they parse as
      # common.storage.images / common.storage.vllmCommon, which nothing reads,
      # and the harness silently falls back to images.benchmark from
      # defaults.yaml (ghcr.io/llm-d/llm-d-benchmark) -- an image with no
      # /entrypoint.sh and no /usr/local/bin/run, so the harness container exits
      # 127 within ~20s having produced no task artifacts.
      images:
        vllmOpenai:
          repository: ghcr.io/llm-d/llm-d-inference-sim
          tag: latest
        vllm:
          repository: ghcr.io/llm-d/llm-d-inference-sim
          tag: latest
        # The harness pod runs THIS image: agent + in-pod gateway + grader + otel,
        # the single-container standalone bundle. Swap for any published
        # evals/<benchmark>--<agent>-standalone image to run a different eval.
        benchmark:
          # codex agent: its web search is client-side, so it works on
          # non-Anthropic served models (unlike claude-code's server-side one).
          repository: ghcr.io/exgentic/evals/gaia--codex-standalone
          tag: v0.1.0
          pullPolicy: IfNotPresent

      vllmCommon:
        shmMemory: 500Mi
        volumes:
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm

    # =========================================================================
    # STANDALONE -- Only applies when standalone.enabled: true
    # =========================================================================
    standalone:
      enabled: false
      replicas: 1

      resources:
        limits:
          memory: 100Mi
          cpu: "0"
        requests:
          memory: 100Mi
          cpu: "0"

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      vllm:
        modelCommand: imageDefault
        args:
          - "--model"
          - "/model-cache/$(MODEL_PATH)"
          - "--port"
          - "$(VLLM_METRICS_PORT)"
          - "--served-model-name"
          - "$(MODEL_NAME)"

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      inferenceExtension:
        monitoring:
          prometheus:
            enabled: false

      routing:
        proxy:
          enabled: false

      gateway:
        className: epponly
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

      prefill:
        enabled: true
        replicas: 1

        parallelism:
          tensor: 1
          data: 1
          dataLocal: 1
          workers: 1

        resources:
          limits:
            memory: 100Mi
            cpu: "0"
          requests:
            memory: 100Mi
            cpu: "0"

        accelerator:
          count: 0

        vllm:
          modelCommand: imageDefault
          additionalFlags: []

      decode:
        replicas: 1

        parallelism:
          tensor: 1
          data: 1
          dataLocal: 1
          workers: 1

        resources:
          limits:
            memory: 100Mi
            cpu: "0"
          requests:
            memory: 100Mi
            cpu: "0"

        accelerator:
          count: 0

        vllm:
          modelCommand: imageDefault
          additionalFlags: []

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================

    # -------------------------------------------------------------------------
    # Harness Configuration
    # Corresponds to: LLMDBENCH_HARNESS_PVC_SIZE=3Gi
    #                 LLMDBENCH_HARNESS_CPU_NR=1
    #                 LLMDBENCH_HARNESS_CPU_MEM=2Gi
    # -------------------------------------------------------------------------
    harness:
      name: eval-containers
      experimentProfile: gaia.yaml
      # Run our script directly instead of the default load-generator entrypoint
      # (llm-d-benchmark.sh, which is not present in the eval image).
      entrypoint: /workspace/harnesses/eval-containers-llm-d-benchmark.sh
      pvcSize: 5Gi
      # runAsUser and serviceAccount are OpenShift-specific.
      # Set them in your --cluster-config file (see docs/openshift-setup.md).
      # A real agent + in-pod gateway runs here, not a load generator -- give it room.
      extraEnvVars:
        # Per-task agent wall-clock cap (seconds), read by the image's run-agent.
        # The image default of 300 truncates a reasoning model mid-task. NOTE this
        # is PER ATTEMPT: images with 2-attempt grading re-invoke run-agent on a
        # failed first try, so a task's wall-clock can reach ~2x this value.
        - name: EVAL_TIMEOUT
          value: "1500"
        # GAIA's full set is 165 tasks, most of which need live web search. The
        # agent's search is client-side, so in a cluster without egress those
        # tasks fail for connectivity, not model quality. no-search is the 54
        # tasks answerable without it -- the only subset whose score means
        # anything here. Drop this to run all 165.
        - name: EVAL_GAIA_SUBSET
          value: no-search
      resources:
        cpu: "2"
        memory: 6Gi

    # dataAccess.runAsUser and dataAccess.serviceAccount are OpenShift-specific.
    # Set them in your --cluster-config file (see docs/openshift-setup.md).

    workDir: "~/data/eval-gaia"
