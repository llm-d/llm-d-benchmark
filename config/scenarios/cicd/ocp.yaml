# OpenShift Container Platform CI/CD Scenario
# Based on scenarios/cicd/ocp_fb.sh
#
# CI/CD scenario for OpenShift clusters.
# Uses Qwen/Qwen2.5-3B so the standalone baseline and FMA nightlies exercise a
# representative model whose cold start is measurable.
# GPU affinity is auto-detected (commented out in original).

scenario:
  - name: "ocp-cicd"

    common:
      acceleratorType:
        labelKey: nvidia.com/gpu.product
        # labelValue: NVIDIA-L40S
        labelValue: NVIDIA-H100-80GB-HBM3
      # Model
      model:
        name: Qwen/Qwen3-4B
        shortName: qwen-qwen3-4b
        path: models/Qwen/Qwen3-4B
        huggingfaceId: Qwen/Qwen3-4B
        # Qwen3-4B native context is 32768; keep maxModelLen within it. The FMA
        # launcher DOES pass this through (live instance options show
        # --max-model-len 32768 alongside --gpu-memory-utilization).
        maxModelLen: 32768
        blockSize: 16
        # FMA launcher runs vLLM with --enable-sleep-mode; the final warmup
        # sampler step (flashinfer_sample -> torch.softmax) needs a few hundred
        # MiB of headroom. At the default 0.95 the KV cache fills the GPU
        # (~66.8 GiB) leaving ~0.5 GiB free -> flaky ~56 MiB OOM in warmup.
        # 0.90 matches the FMA guide scenarios and leaves ~4 GiB headroom.
        gpuMemoryUtilization: 0.90

      affinity:
        enabled: true
        nodeSelector:
          # nvidia.com/gpu.product: NVIDIA-L40S
          nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

      # storage:
      #   modelPvc:
      #     storageClassName: ocs-storagecluster-cephfs
      #   workloadPvc:
      #     storageClassName: ocs-storagecluster-cephfs

      vllmCommon:
        priorityClassName: nightly-gpu-critical
        flags:
          # Disable enforce_eager so the standalone vLLM runs torch.compile +
          # CUDA-graph capture -- otherwise Dynamo / Torch Compile / Memory
          # Profiling metrics are all 0 (those phases are skipped under eager).
          enforceEager: false
          # FMA runs with prefix caching off (--no-enable-prefix-caching)
          noPrefixCaching: true

      images:
        benchmark:
          repository: ghcr.io/llm-d/llm-d-benchmark
          tag: nightly

    standalone:
      enabled: false

    # Deployment method
    modelservice:
      enabled: true

      prefill:
        enabled: true
        replicas: 1


      decode:
        enabled: true
        replicas: 1
        acceleratorType:
          labelKey: nvidia.com/gpu.product
          # labelValue: NVIDIA-L40S
          labelValue: NVIDIA-H100-80GB-HBM3

    fma:
      enabled: false
      iterations: 10


    harness:
      name: vllm-benchmark
      experimentProfile: sanity_random.yaml
      # executable: llm-d-benchmark.py

    workDir: /tmp/llmdbenchcicd-ocp/