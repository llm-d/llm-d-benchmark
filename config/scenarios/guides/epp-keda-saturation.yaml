# EPP+KEDA SATURATION AUTOSCALING GUIDE
#
# Same base configuration as `inference-scheduling.yaml` (Qwen3-32B, 2 decode
# pods, modelservice deployment) but with direct EPP+KEDA saturation autoscaling.
# No WVA controller, no VariantAutoscaling, no prometheus-adapter.
#
# Running:
#
#   llmdbenchmark --spec guides/epp-keda-saturation standup -p <namespace>
#
# The `--epp-keda-saturation` CLI flag is NOT required with this scenario because
# `eppKedaSaturation.enabled: true` is already hard-coded below. Pass the flag with
# the plain `inference-scheduling` scenario if you want to toggle EPP+KEDA on
# without editing YAML.

scenario:
  # =========================================================================
  # EPP+KEDA SATURATION AUTOSCALING - Qwen3-32B with 2 decode pods
  # =========================================================================
  - name: "epp-keda-saturation"

    common:
      # =========================================================================
      # MODEL CONFIGURATION
      # =========================================================================
      model:
        name: Qwen/Qwen3-32B
        shortName: qwen-qwen3-32b
        path: models/Qwen/Qwen3-32B
        huggingfaceId: Qwen/Qwen3-32B
        size: 1Ti
        maxModelLen: 16000
        blockSize: 64
        gpuMemoryUtilization: 0.95

      # =========================================================================
      # STORAGE
      # =========================================================================
      storage:
        modelPvc:
          size: 1Ti
        hostPath:
          # TODO: should we default to enabled: true for WVA scenarios?
          enabled: false
          path: /mnt/models
          storageClassName: hostpath
          capacity: 1Ti
          # Target the GPU nodes where decode pods will schedule.
          # Replace with your cluster's actual node labels.
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations: []
          daemonSetTimeout: 3600

      # =========================================================================
      # VLLM COMMON CONFIGURATION
      # =========================================================================
      vllmCommon:
        kvTransfer:
          enabled: true
          connector: NixlConnector
          role: kv_both

        flags:
          enforceEager: true
          disableLogRequests: true
          disableUvicornAccessLog: true
          allowLongMaxModelLen: "1"
          serverDevMode: "1"

        volumes:
          - name: shared-config
            type: emptyDir
            emptyDir: {}
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: shared-config
            mountPath: /shared-config

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      gateway:
        className: agentgateway
        externallyManaged: true  # agentgateway already exists in cluster

      # =========================================================================
      # ROUTING / GAIE CONFIGURATION
      #
      # EPP+KEDA autoscaling is driven by EPP queue depth, so we enable the
      # `flowControl` feature gate in the EPP's EndpointPickerConfig. That gate
      # is not on by default, and toggling it requires shipping a custom
      # EndpointPickerConfig (the default one the gaie chart ships has no
      # `featureGates` block). We inline it here and point `pluginsConfigFile`
      # at this filename so the chart mounts it as the active config.
      # =========================================================================
      router:
        epp:
          pluginsConfigFile: "epp-keda-optimized-baseline.yaml"
          pluginsCustomConfig:
            epp-keda-optimized-baseline.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              featureGates:
                - flowControl
              plugins:
                - type: queue-scorer
                - type: kv-cache-utilization-scorer
                - type: prefix-cache-scorer
                - type: no-hit-lru-scorer
              schedulingProfiles:
                - name: default
                  plugins:
                    - pluginRef: queue-scorer
                      weight: 2
                    - pluginRef: kv-cache-utilization-scorer
                      weight: 2
                    - pluginRef: prefix-cache-scorer
                      weight: 3
                    - pluginRef: no-hit-lru-scorer
                      weight: 2

      # =========================================================================
      # PREFILL / DECODE CONFIGURATION (same as inference-scheduling.yaml)
      # =========================================================================
      prefill:
        enabled: false
        replicas: 0

      decode:
        replicas: 2

        initContainers:
          - name: preprocess
            imageKey: benchmark
            imagePullPolicy: Always
            command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
            volumeMounts:
              - name: shared-config
                mountPath: /shared-config

        parallelism:
          tensor: 1
          data: 1
          dataLocal: 1
          workers: 1

        resources:
          limits:
            memory: 64Gi
            cpu: "16"
          requests:
            memory: 64Gi
            cpu: "16"

        extraEnvVars: []

        extraContainerConfig:
          ports:
            - containerPort: 5557
              protocol: TCP
            - containerPort: 8200
              name: metrics
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        additionalVolumeMounts: []
        additionalVolumes: []

        probes:
          startup:
            path: /v1/models
            failureThreshold: 60
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          liveness:
            path: /health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          readiness:
            path: /v1/models
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2

        monitoring:
          podmonitor:
            enabled: true
            portName: metrics
            path: /metrics
            interval: 30s
            labels:
              release: llmd


    # =========================================================================
    # EPP+KEDA SATURATION CONFIGURATION
    #
    # Direct KEDA autoscaling using EPP pool metrics. All thresholds and
    # behavior parameters are spelled out below so users can tweak them
    # per-experiment without editing defaults.yaml.
    # =========================================================================
    eppKedaSaturation:
      enabled: true

      namespace: ""              # defaults to deploy namespace (first slot of `-p`)

      prometheus:
        baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
        port: 9091

      epp:
        poolName: ""             # defaults to model_id_label at render time
        metricsPortName: http-metrics
        metricsPort: 9090
        prometheusServiceAccount: thanos-querier
        prometheusServiceAccountNamespace: openshift-monitoring

      scaledObject:
        minReplicas: 1
        maxReplicas: 10
        pollingInterval: 15
        unsafeSsl: true
        # Defaults come from defaults.yaml; override the whole set here, e.g.
        # (metricType + activationThreshold optional, default AverageValue/"0"):
        # triggers:
        #   - name: pool-saturation
        #     query: 'max(llm_d_epp_flow_control_pool_saturation{inference_pool="${poolName}"})'
        #     threshold: "0.7"
        #     metricType: AverageValue
        #     activationThreshold: "0"
        #   - name: running-requests
        #     query: 'sum(llm_d_epp_request_running{model_name="${modelName}"})'
        #     threshold: "16"
        #     metricType: AverageValue
        #     activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              # Adjust periodSeconds to match actual pod startup time.
              # GPU hardware (H100/A100): 180 seconds
              # Simulator / kind cluster (fast startup): 30 seconds
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

    harness:
      name: inference-perf
      experimentProfile: shared_prefix_synthetic.yaml

    workDir: "~/data/epp-keda-saturation"