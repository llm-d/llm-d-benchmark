# TIERED PREFIX CACHE / PREFIX CACHE OFFLOADING WELL LIT PATH -- SGLang backend (pre-set, trimmed)
#
# SGLang-backed variant of the `tiered-prefix-cache` guide. This is a TRIMMED scenario:
# it keeps only the keys the kustomize deploy method actually consumes
# (kustomize.*, model.*, harness/workDir). The kustomize deploy applies the
# upstream llm-d guide's SGLang overlay directly, so the modelservice/
# standalone/decode/prefill/vllm blocks (present in the un-trimmed guide
# scenarios) are inert here and have been omitted. Anything not set falls
# back to config/templates/values/defaults.yaml.
#
# SGLang is ONLY supported under the kustomize deploy method. The actual
# engine command comes from guides/tiered-prefix-cache/modelserver/gpu/sglang in the
# llm-d repo (`python3 -m sglang.launch_server ...`), NOT from this file.
# See docs/sglang.md.
#
# Exercises tiered KV-cache offloading with the SGLang engine.
#
# Run with:
#   llmdbenchmark --spec guides/tiered-prefix-cache-sglang standup   -t kustomize -p "$NS"
#   llmdbenchmark --spec guides/tiered-prefix-cache-sglang smoketest -t kustomize -p "$NS"
#   llmdbenchmark --spec guides/tiered-prefix-cache-sglang run       -t kustomize -p "$NS" \
#       -l inference-perf -w shared_prefix_synthetic.yaml
#   llmdbenchmark --spec guides/tiered-prefix-cache-sglang teardown  -t kustomize -p "$NS"
# ===========================================================================

scenario:
  - name: "tiered-prefix-cache-sglang"

    # =======================================================================
    # KUSTOMIZE DEPLOY METHOD -- pre-enabled, pinned to the SGLang overlay.
    # This block defines the ENTIRE deployment (the upstream guide's
    # manifests + the gpu/sglang model-server overlay). See docs/kustomize.md
    # and docs/sglang.md.
    # =======================================================================
    kustomize:
      enabled: true

      guideName: "tiered-prefix-cache"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      # Selects the SGLang overlay in place of the default gpu/vllm one.
      # NOTE: this guide's SGLang overlays are the HiCache offloading paths
      # modelserver/gpu/sglang/native/cpu/{base,gke} (plus a plain
      # gpu/sglang/base). The README's first model-server apply line is the
      # vLLM native/cpu path, which the acceleratorBackend swap rewrites to
      # gpu/sglang/native/cpu/${INFRA_PROVIDER} -- i.e. the SGLang HiCache
      # (CPU-tier) overlay, which is what a tiered-cache benchmark wants.
      # INFRA_PROVIDER: base (default) -> native/cpu/base; set gke on GKE
      # (native/cpu/gke exists).
      acceleratorBackend: "gpu/sglang"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides:
        INFRA_PROVIDER: base   # base | gke (native/cpu/gke exists for GKE)

      # Strategic-merge patches on the SGLang modelserver pods. Empty by
      # default (upstream injects HF_TOKEN from the auto-created
      # llm-d-hf-token Secret). Use this to tune SGLang -- e.g. replica
      # count or SGLang server flags (memory knob: --mem-fraction-static):
      #
      #   patches:
      #     - patch: |
      #         apiVersion: apps/v1
      #         kind: Deployment
      #         metadata: { name: decode }
      #         spec: { replicas: 4 }
      patches: []

    # -----------------------------------------------------------------------
    # Model metadata. Under kustomize the deployed model is fixed by the
    # guide's manifests; model.name is recorded as metadata and used by the
    # harness to target the served model. Keep in sync with the guide.
    # -----------------------------------------------------------------------
    model:
      name: Qwen/Qwen3-32B
      shortName: qwen-qwen3-32b
      path: models/Qwen/Qwen3-32B
      huggingfaceId: Qwen/Qwen3-32B
      size: 1Ti
      maxModelLen: 16000
      blockSize: 64
      gpuMemoryUtilization: 0.95
      cacheBase: /model-cache

    # =======================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =======================================================================
    workDir: "~/data/tiered-prefix-cache-sglang"

    harness:
      name: inference-perf
      experimentProfile: shared_prefix_synthetic.yaml
