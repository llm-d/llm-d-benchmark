# FAST MODEL ACTUATION WELL LIT PATH (kustomize-only)
#
# Deploys the upstream llm-d `fast-model-actuation` guide directly via the
# kustomize deploy method.
#
# NOTE: FMA-specific handling in standup/smoketest/teardown
# keys off kustomize.guideName == "fast-model-actuation".
# See https://github.com/llm-d/llm-d/tree/main/guides/fast-model-actuation
#
# Run with:
#   llmdbenchmark --spec guides/fast-model-actuation standup   -t kustomize -p "$NS"
#   llmdbenchmark --spec guides/fast-model-actuation smoketest -t kustomize -p "$NS"
#   llmdbenchmark --spec guides/fast-model-actuation teardown  -t kustomize -p "$NS"
# ===========================================================================

scenario:
  - name: "fast-model-actuation"
    common:
      # -----------------------------------------------------------------------
      # Model metadata. Under kustomize the deployed model is fixed by the
      # guide's manifests, so these values do NOT drive the deployment. They
      # MUST, however, match the model the guide actually serves -- the
      # post-standup smoketest validates the /v1/models endpoint against
      # model.name (the guide serves Qwen/Qwen3-0.6B via its InferenceServerConfig).
      # -----------------------------------------------------------------------
      model:
        name: Qwen/Qwen3-0.6B
        shortName: qwen-qwen3-0-6b
        path: models/Qwen/Qwen3-0.6B
        huggingfaceId: Qwen/Qwen3-0.6B
        size: 10Gi
        maxModelLen: 16000
        blockSize: 64
        gpuMemoryUtilization: 0.9

    modelservice:
      enabled: true

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # -------------------------------------------------------------------------
      router:
        extraServicePorts:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8081
          - name: metrics
            port: 9090
            protocol: TCP
            targetPort: 9090
        epp:
          replicas: 1
          flags:
            v: 2
          pluginsConfigFile: agentic-serving-plugins.yaml
          pluginsCustomConfig:
            agentic-serving-plugins.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: token-load-scorer
              - type: inflight-load-producer
              - type: approx-prefix-cache-producer
                parameters:
                  maxPrefixTokensToMatch: 262144
                  # WORKAROUND: autoTune is disabled and the LRU is sized manually.
                  # autoTune derives lruCapacityPerServer from on-device (HBM) blocks
                  # only (num_gpu_blocks) and ignores the KV-cache offload tier. With
                  # offloading enabled this under-counts cached prefixes.
                  # We size the LRU for the offload-extended cache
                  # (~num_gpu_blocks x 1000). Remove once autoTune is made offload-aware
                  # upstream — tracked by the llm-d-router offload-aware-LRU issue.
                  # https://github.com/llm-d/llm-d-router/issues/1650
                  autoTune: false
                  lruCapacityPerServer: 1570000
                  blockSizeTokens: 256
              - type: prefix-cache-affinity-filter
                parameters:
                  peakPrefillThroughput: 16444
              schedulingProfiles:
              - name: default
                plugins:
                - pluginRef: prefix-cache-affinity-filter
                - pluginRef: token-load-scorer
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        modelServers:
          matchLabels:
            llm-d.ai/guide: "fast-model-actuation"

    # =======================================================================
    # KUSTOMIZE DEPLOY METHOD -- pre-enabled. This block defines the ENTIRE
    # deployment (the upstream FMA guide's manifests). See docs/kustomize.md.
    # =======================================================================
    kustomize:
      enabled: true

      guideName: "fast-model-actuation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}   # override/fill the guide README's ${VAR}

    harness:
      name: nop
      experimentProfile: nop.yaml
      executable: llm-d-benchmark.py

    workDir: "~/data/fast-model-actuation"