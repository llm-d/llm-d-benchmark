name: CI - Nightly Run Benchmark on GKE ("Standalone" standup method)

on:
  workflow_dispatch:
    inputs:
      decode_pods:
        description: 'Number of decode (vllm "standalone") pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Number of prefill pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      cluster_namespace:
        description: 'Cluster namespace'
        required: false
        default: 'llmdbenchcicdsns-gke'
      gateway_class:
        description: 'Class of gateway used ("istio", "agentgateway", "epponly", "none")'
        required: false
        default: 'none'
      monitoring_enabled:
        description: 'Enabled monitoring ("true", "false")'
        required: true
        type: 'string'
        default: 'false'
      dry_run:
        description: 'Execute workflow in "dry-run" mode ("true", "false")'
        required: false
        default: 'false'
      verbose:
        description: 'Execute workflow in "verbose" mode ("true", "false")'
        required: false
        default: 'false'
        type: 'string'
      harness:
        description: 'Harness to be used during "run" operation ("inference-perf", "guidellm", "inferencemax", "vllm-benchmark", "nop")'
        required: false
#        default: 'nop'
        default: vllm-benchmark
        type: 'string'
      workload:
        description: 'Workload profile to be used during "run" operation (check list under "workload/profiles")'
        required: false
#        default: 'nop.yaml'
        default: sanity_random.yaml
        type: 'string'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      tpu_topology:
        description: 'GKE TPU topology (e.g. 2x4, 2x2x1)'
        required: false
        type: 'string'
        default: '2x4'
      tpu_chips:
        description: 'Total TPU chips to request (0 for simulated)'
        required: false
        type: 'string'
        default: '0'
      tpu_wait_timeout:
        description: 'Minutes to wait for TPU chips to become available (0 = no wait, fail immediately)'
        required: false
        type: 'string'
        default: '0'
      tpu_nodepool:
        description: 'Target TPU node pool name (empty = do not override)'
        required: false
        type: 'string'
        default: ''
      data_access_timeout:
        description: 'Timeout in seconds for data access and harness run execution'
        required: false
        type: 'string'
        default: '1200'
      wait_timeout:
        description: 'Timeout in seconds to wait for benchmark pods to complete'
        required: false
        type: 'string'
        default: '1200'
      pvc_bind_timeout:
        description: 'Timeout in seconds to wait for a pvc to be bound'
        required: false
        type: 'string'
        default: '1200'
      job_timeout:
        description: 'Timeout for the Kubernetes job itself (e.g. 2700s)'
        required: false
        type: 'string'
        default: '2700s'
      standup_timeout:
        description: 'Timeout in seconds for standup of a new llm-d stack'
        required: false
        type: 'string'
        default: '2400'

#  push:
#    branches:
#      - main

  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

jobs:
  nightly:
    uses: llm-d/llm-d-infra/.github/workflows/reusable-ci-nightly-benchmark.yaml@main
    with:
      scenario_dir: ${{ inputs.scenario_dir || 'cicd' }}
      standup_method: ${{ inputs.standup_method || 'standalone' }}
      standup_scenario: ${{ inputs.standup_scenario || 'gke' }}
      decode_pods: ${{ inputs.decode_pods || 'auto' }}
      prefill_pods: ${{ inputs.prefill_pods || 'auto' }}
      accelerator_type: ${{ inputs.accelerator_type || 'gpu' }}
      backend_type: ${{ inputs.backend_type || 'vllm' }}
      infra_provider: ${{ inputs.infra_provider || 'gke' }}
      connector: ${{ inputs.connector || '' }}
      cluster_namespace: ${{ inputs.cluster_namespace || 'llmdbenchcicdsns-gke' }}
      helm_release: ${{ inputs.helm_release || 'llmdbenchcicdr-gke' }}
      workspace_dir: ${{ inputs.workspace_dir || '/tmp/llmdbenchcicds-gke' }}
      bucket_project: ${{ inputs.bucket_project || 'llm-d-scale' }}
      bucket_provider: ${{ inputs.bucket_provider || 'gcs' }}
      bucket_path: ${{ inputs.bucket_path || 'llm-d-benchmarks/regressions' }}
      gateway_class: ${{ inputs.gateway_class || 'none' }}
      monitoring_enabled: ${{ inputs.monitoring_enabled || 'false' }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      verbose: ${{ inputs.verbose || 'false' }}
      harness: ${{ inputs.harness || 'vllm-benchmark' }}
      workload: ${{ inputs.workload || 'sanity_random.yaml' }}
#      harness: ${{ inputs.harness || 'nop' }}
#      workload: ${{ inputs.workload || 'nop.yaml' }}
      cleanup: ${{ inputs.cleanup || 'true' }}
    secrets: inherit
